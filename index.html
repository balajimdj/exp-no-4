<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  :root{
    --bg:#F5F3EF;
    --card:#FFFFFF;
    --ink:#22252A;
    --ink-soft:#767a82;
    --accent:#3E6B5C;
    --accent-dark:#2E5346;
    --line:#E4E1DA;
    --danger:#C0503A;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:60px 20px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    font-weight:700;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:26px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 10px 30px -14px rgba(0,0,0,0.15);
    padding:22px;
  }
  form{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  input[type="text"]{
    flex:1;
    font-size:15px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    font-family:inherit;
  }
  input[type="text"]:focus{
    border-color:var(--accent);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .add-btn{
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    padding:0 20px;
    border-radius:6px;
  }
  .add-btn:hover{ background:var(--accent-dark); }

  .stats{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .clear-btn{
    background:none;
    color:var(--danger);
    font-size:13px;
    text-decoration:underline;
    padding:0;
  }

  ul{
    list-style:none;
    margin:0;
    padding:0;
  }
  li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    animation:fadeIn 0.2s ease;
  }
  li:last-child{ border-bottom:none; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .check{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #C6C2B8;
    background:transparent;
    flex:none;
    position:relative;
  }
  .check:hover{ border-color:var(--accent); }
  li.done .check{
    background:var(--accent);
    border-color:var(--accent);
  }
  .check::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
    opacity:0;
  }
  li.done .check::after{ opacity:1; }

  .task-text{
    flex:1;
    font-size:15px;
    word-break:break-word;
  }
  li.done .task-text{
    color:var(--ink-soft);
    text-decoration:line-through;
  }

  .del{
    background:none;
    color:#C6C2B8;
    font-size:19px;
    line-height:1;
    padding:2px 4px;
  }
  .del:hover{ color:var(--danger); }

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 10px;
  }
</style>
</head>
<body>

<div class="app">
  <h1>To-Do List</h1>
  <p class="subtitle">Add a task, check it off, keep moving.</p>

  <div class="card">
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="150" required>
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="stats">
      <span id="statsText">0 tasks</span>
      <button type="button" class="clear-btn" id="clearBtn">Clear completed</button>
    </div>

    <ul id="taskList"></ul>
    <p class="empty" id="emptyMsg">Nothing here yet — add your first task above.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  let tasks = [];

  const form = document.getElementById("taskForm");
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");
  const statsText = document.getElementById("statsText");
  const emptyMsg = document.getElementById("emptyMsg");
  const clearBtn = document.getElementById("clearBtn");

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function render(){
    list.innerHTML = "";

    if(tasks.length === 0){
      emptyMsg.style.display = "block";
    } else {
      emptyMsg.style.display = "none";
      tasks.forEach(task => list.appendChild(buildTaskEl(task)));
    }

    const done = tasks.filter(t => t.done).length;
    statsText.textContent = tasks.length === 0
      ? "0 tasks"
      : `${done} of ${tasks.length} done`;
  }

  function buildTaskEl(task){
    const li = document.createElement("li");
    li.className = task.done ? "done" : "";

    const check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.setAttribute("aria-label", "Toggle task done");
    check.addEventListener("click", () => toggleTask(task.id));

    const text = document.createElement("span");
    text.className = "task-text";
    text.textContent = task.text;

    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.setAttribute("aria-label", "Delete task");
    del.addEventListener("click", () => deleteTask(task.id));

    li.appendChild(check);
    li.appendChild(text);
    li.appendChild(del);
    return li;
  }

  function addTask(text){
    tasks.push({ id: uid(), text: text.trim(), done: false });
    render();
  }

  function toggleTask(id){
    const task = tasks.find(t => t.id === id);
    if(task) task.done = !task.done;
    render();
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(!input.value.trim()) return;
    addTask(input.value);
    input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", function(){
    tasks = tasks.filter(t => !t.done);
    render();
  });

  render();
})();
</script>

</body>
</html>
